name: 缺陷报告
description: 报告可复现的问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 实际发生了什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 观察到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: Windows 11 / Edge 版本 / Node.js 22
  - type: textarea
    id: evidence
    attributes:
      label: 补充证据
      description: 可附截图、日志或失败测试链接；请先移除 Token 等敏感信息。
