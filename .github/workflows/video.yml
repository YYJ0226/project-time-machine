name: Course video checks

on:
  pull_request:
    paths:
      - 'video/**'
      - '.github/workflows/video.yml'
  push:
    branches: [main]
    paths:
      - 'video/**'
      - '.github/workflows/video.yml'

permissions:
  contents: read

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
